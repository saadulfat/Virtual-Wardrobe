
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wardrobe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123abc}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wardrobe}
      MYSQL_USER: ${MYSQL_USER:-wardrobe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wardrobe_password}
    ports:
      - "3307:3306"
    volumes:
      - wardrobe_mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: virtual_wardrobe_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:123abc@db:3306/wardrobe}
      - SECRET_KEY=${SECRET_KEY:-super-secret-change-me}
      - KIE_API_KEY=${KIE_API_KEY:-88c5cfa96d1285105f1576580b5472bc}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-769acee0bd530f6f80ba385f5456d5cf}
      - STABILITY_API_KEY=${STABILITY_API_KEY:-sk-oeBJvbKVqGpDnN9SNS6GzGyQYC1dIgIziH0cKJAi6p0nRNkJ}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyA61gPAbvNPqsOQkuZOQXgwjDJ_oR4W7WI}
    volumes:
      - ./app/static:/app/app/static

volumes:
  wardrobe_mysql_data: