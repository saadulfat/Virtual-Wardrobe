<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title if title else 'StyleWise' }}</title>

<!-- Google Fonts -->
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<!-- Tailwind CSS for modern design -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Custom CSS Variables -->
<style type="text/tailwindcss">
      :root {
        --primary-color: #1919e6;
        --accent-color: #9C27B0;
      }
</style>

<!-- Immediately apply saved theme to prevent flash -->
<script>
  (function() {
    const theme = localStorage.getItem('theme');
    if (theme === 'dark') {
      document.documentElement.classList.add('dark-theme');
    }
  })();
</script>

<link rel="stylesheet" href="/static/style.css?v={{ style_hash }}">
</head>
<body class="bg-gray-50 font-manrope" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-gray-200 bg-white px-10 py-3">
  <div class="flex items-center gap-1 text-zinc-900">
    <img src="/static/images/logo.png" alt="StyleWise Logo" class="h-10 w-10">
    <h2 class="text-zinc-900 text-lg font-bold leading-tight tracking-[-0.015em]">StyleWise</h2>
  </div>
  <div class="flex flex-1 justify-end gap-4 items-center">
    <nav class="hidden md:flex items-center gap-6">
      <a class="text-zinc-900 text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="/">Home</a>
      <a class="text-zinc-900 text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="/signup">Sign Up</a>
      <a class="text-zinc-900 text-sm font-medium leading-normal hover:text-[var(--primary-color)] transition-colors" href="/login">Log In</a>
    </nav>
    <div class="flex items-center gap-2">
      <button class="flex items-center justify-center rounded-full p-2 transition-colors hover:bg-gray-100" id="theme-toggle">
        <span class="material-symbols-outlined text-zinc-600">dark_mode</span>
      </button>
      <a href="/logout" class="flex items-center justify-center rounded-full p-2 transition-colors hover:bg-gray-100">
        <span class="material-symbols-outlined text-zinc-600">logout</span>
      </a>
    </div>
  </div>
</header>

<main class="flex-1 px-4 sm:px-6 lg:px-8 py-8 w-full">
  <div class="max-w-5xl mx-auto">
    {% if error %}
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800">
      {{ error }}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="text-center py-4 text-gray-500 text-sm">&copy; {{ 2025 }} StyleWise</footer>

<script>
  // Theme toggle functionality
  window.addEventListener('DOMContentLoaded', () => {
    // Theme toggle with instant class switching
    const toggleLink = document.getElementById('theme-toggle');
    if (toggleLink) {
      toggleLink.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Instantly apply theme change
        document.documentElement.classList.toggle('dark-theme');
        
        // Save preference
        const isDark = document.documentElement.classList.contains('dark-theme');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        // Update icon
        const icon = toggleLink.querySelector('.material-symbols-outlined');
        icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        
        // Force immediate repaint
        document.documentElement.offsetHeight;
      });
    }
    
    // Apply theme on page load
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark-theme');
      const icon = document.getElementById('theme-toggle')?.querySelector('.material-symbols-outlined');
      if (icon) icon.textContent = 'light_mode';
    }
  });
</script>
</body>
</html>
