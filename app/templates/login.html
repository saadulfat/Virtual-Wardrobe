{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-4 px-4 sm:px-6 lg:px-8">
  <div class="max-w-sm w-full space-y-8">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="w-full h-40 bg-gray-100">
        <img src="/static/images/avatar.png" alt="Avatar" class="w-full h-full object-cover">
      </div>
      <div class="p-6">
        <div class="text-center">
          <h2 class="mt-2 text-3xl font-bold text-gray-900">Welcome back</h2>
        </div>

        {% if error %}
        <div class="mt-6 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="mt-3 space-y-3">
          <div class="rounded-md shadow-sm space-y-4">
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required 
                     class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)] focus:z-10 sm:text-sm"
                     placeholder="Email address">
            </div>
            <div>
              <div class="flex items-center justify-between">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <a href="#" class="text-sm font-medium text-[var(--primary-color)] hover:text-indigo-500">
                  Forgot password?
                </a>
              </div>
              <input id="password" name="password" type="password" autocomplete="current-password" required 
                     class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)] focus:z-10 sm:text-sm"
                     placeholder="Password">
            </div>
          </div>

          <div>
            <button type="submit" 
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-[var(--primary-color)] hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
              <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                <span class="material-symbols-outlined text-white group-hover:text-indigo-200">login</span>
              </span>
              Sign in
            </button>
          </div>
        </form>

        <div class="mt-6">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500">
                New to StyleWise?
              </span>
            </div>
          </div>

          <div class="mt-4">
            <a href="/signup" 
               class="w-full flex justify-center py-3 px-4 border border-gray-300 text-sm font-medium rounded-lg text-[var(--primary-color)] bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
              Create an account
            </a>
          </div>
        </div>
      </div>
    </div>
    
    <div class="text-center mt-6">
      <a href="/" class="text-sm font-medium text-gray-600 hover:text-gray-900">
        <span class="material-symbols-outlined align-middle">arrow_back</span>
        Back to home
      </a>
    </div>
  </div>
</div>
{% endblock %}
